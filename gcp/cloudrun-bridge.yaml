# GCP Cloud Run — FuseFlash Bridge service
# Deploy with:
#   gcloud run services replace gcp/cloudrun-bridge.yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fuseflash-bridge
  labels:
    app: fuseflash
    component: bridge
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/fuseflash-bridge:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: FUSEFLASH_RPC_URL
              value: https://rpc.fusespark.io
            - name: FUSEFLASH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: fuseflash-secrets
                  key: private-key
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
