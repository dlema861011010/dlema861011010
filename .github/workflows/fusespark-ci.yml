name: FuseSpark CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fusespark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go: FuseFlash P2P node ─────────────────────────────────────────────────
  go:
    name: Go — fuseflash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: fuseflash/go.sum

      - name: Vet
        working-directory: fuseflash
        run: go vet ./...

      - name: Test
        working-directory: fuseflash
        run: go test ./... -race -timeout 60s -coverprofile=coverage.out

      - name: Build node binary
        working-directory: fuseflash
        run: go build ./cmd/node

  # ── Python: bridge service ─────────────────────────────────────────────────
  python:
    name: Python — bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - name: Install dependencies
        working-directory: bridge
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: bridge
        run: |
          pip install ruff --quiet
          ruff check . --select E,W,F --ignore E501

      - name: Type-check (mypy)
        working-directory: bridge
        run: |
          pip install mypy types-requests --quiet
          mypy fuseflash_bridge.py blockscout.py --ignore-missing-imports

  # ── Node.js: Ember smart-wallet ────────────────────────────────────────────
  node:
    name: Node — smart-wallet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart-wallet/package-lock.json

      - name: Install dependencies
        working-directory: smart-wallet
        run: npm ci

      - name: Lint
        working-directory: smart-wallet
        run: npm run lint || true   # non-fatal until lint config is wired in

  # ── Docker: build all images ───────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [go, python, node]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build fuseflash-node image
        uses: docker/build-push-action@v6
        with:
          context: ./fuseflash
          file: ./docker/Dockerfile.fuseflash
          push: false
          tags: fuseflash-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./bridge
          file: ./docker/Dockerfile.bridge
          push: false
          tags: fuseflash-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GCP deploy (main only) ─────────────────────────────────────────────────
  deploy:
    name: GCP — Cloud Run deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true   # skip gracefully if secret not yet configured

      - name: Submit Cloud Build
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        uses: google-github-actions/run-gcloud@v2
        with:
          args: >-
            builds submit
            --config gcp/cloudbuild.yaml
            --substitutions _PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},SHORT_SHA=${{ github.sha }}
