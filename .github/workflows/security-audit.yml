name: Security Audit Pipeline

on:
  push:
    branches: [ "main", "develop", "release/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # CodeQL Analysis for Go, JavaScript, Python
  codeql-analysis:
    name: CodeQL Security Scanning
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use CodeQL community packs for enhanced security rules
          queries: +security-and-quality,security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # Solidity Smart Contract Security Scanning
  solidity-security-scan:
    name: Solidity Contract Audit (Slither)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: |
          pip install slither-analyzer
          pip install solc-select
          solc-select install 0.8.20
          solc-select use 0.8.20

      - name: Run Slither Security Analysis
        run: |
          if [ -d "contracts" ] || [ -d "smart-wallet" ]; then
            # Run Slither on Solidity contracts
            slither . --exclude-dependencies --exclude-optimization --exclude-informational \
              --json slither-report.json || true

            # Generate human-readable report
            slither . --exclude-dependencies --print human-summary > slither-summary.txt || true

            echo "### Slither Security Analysis Results" >> $GITHUB_STEP_SUMMARY
            cat slither-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No Solidity contracts found, skipping Slither scan"
          fi

      - name: Upload Slither Results
        uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: slither-security-report
          path: |
            slither-report.json
            slither-summary.txt
          retention-days: 30

  # Secret Scanning (GHAS Native)
  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json

      - name: Scan for hardcoded secrets in config files
        run: |
          echo "### Secret Scanning Results" >> $GITHUB_STEP_SUMMARY

          # Check for common secret patterns
          echo "Scanning for potential secrets in configuration files..." >> $GITHUB_STEP_SUMMARY

          # Search for API keys, tokens, passwords
          if grep -r -i -E "(api_key|api-key|apikey|secret_key|secret-key|password|passwd|token|private_key|stripe_key|usdc_key|database_url)" \
            --include="*.env*" --include="*.config.*" --include="*.yml" --include="*.yaml" --include="*.json" . 2>/dev/null; then
            echo "⚠️ Warning: Potential secrets found in configuration files" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No obvious hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
          fi

  # Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Go Dependency Audit
        if: hashFiles('**/go.mod') != ''
        run: |
          if [ -f "go.mod" ] || [ -f "fuseflash/go.mod" ]; then
            echo "### Go Dependency Audit" >> $GITHUB_STEP_SUMMARY

            # Find all go.mod files and audit them
            find . -name "go.mod" -type f | while read gomod; do
              dir=$(dirname "$gomod")
              echo "Scanning $dir..." >> $GITHUB_STEP_SUMMARY
              cd "$dir"
              go list -json -m all | docker run --rm -i sonatypecommunity/nancy:latest sleuth || true
              cd - > /dev/null
            done
          fi

      - name: Python Dependency Audit
        if: hashFiles('**/requirements.txt') != ''
        run: |
          if [ -f "requirements.txt" ] || [ -f "bridge/requirements.txt" ]; then
            pip install safety
            echo "### Python Dependency Audit" >> $GITHUB_STEP_SUMMARY

            find . -name "requirements.txt" -type f | while read reqfile; do
              echo "Scanning $reqfile..." >> $GITHUB_STEP_SUMMARY
              safety check --file="$reqfile" --json || true
            done
          fi

      - name: Node.js Dependency Audit
        if: hashFiles('**/package.json') != ''
        run: |
          if [ -f "package.json" ] || [ -f "smart-wallet/package.json" ]; then
            echo "### Node.js Dependency Audit" >> $GITHUB_STEP_SUMMARY

            find . -name "package.json" -type f | while read pkgfile; do
              dir=$(dirname "$pkgfile")
              if [ -f "$dir/package-lock.json" ]; then
                echo "Scanning $dir..." >> $GITHUB_STEP_SUMMARY
                cd "$dir"
                npm audit --json > npm-audit.json || true
                cat npm-audit.json >> $GITHUB_STEP_SUMMARY
                cd - > /dev/null
              fi
            done
          fi

  # Validation Script Security Linting
  validation-script-security:
    name: Validation Script Security Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for Bandit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Linters
        run: |
          pip install bandit[toml]
          npm install -g eslint eslint-plugin-security

      - name: Python Security Lint (Bandit)
        run: |
          if find . -name "*.py" -type f | grep -q .; then
            echo "### Python Security Lint Results" >> $GITHUB_STEP_SUMMARY
            bandit -r . -f json -o bandit-report.json --exclude ./venv,./node_modules || true
            bandit -r . --exclude ./venv,./node_modules >> $GITHUB_STEP_SUMMARY || true
          else
            echo "No Python files found"
          fi

      - name: JavaScript/Node Security Lint
        run: |
          if find . -name "*.js" -o -name "*.ts" -type f | grep -q .; then
            echo "### JavaScript Security Lint Results" >> $GITHUB_STEP_SUMMARY

            # Create eslint config for security scanning
            cat > .eslintrc.json << 'EOF'
          {
            "plugins": ["security"],
            "extends": ["plugin:security/recommended"],
            "rules": {
              "security/detect-object-injection": "warn",
              "security/detect-non-literal-regexp": "warn",
              "security/detect-unsafe-regex": "error",
              "security/detect-buffer-noassert": "error",
              "security/detect-child-process": "error",
              "security/detect-disable-mustache-escape": "error",
              "security/detect-eval-with-expression": "error",
              "security/detect-no-csrf-before-method-override": "error",
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-non-literal-require": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-pseudoRandomBytes": "error"
            }
          }
          EOF

            eslint . --ext .js,.ts --format json --output-file eslint-security.json || true
            eslint . --ext .js,.ts >> $GITHUB_STEP_SUMMARY || true
          else
            echo "No JavaScript/TypeScript files found"
          fi

      - name: Shell Script Security Lint (ShellCheck)
        run: |
          if find . -name "*.sh" -type f | grep -q .; then
            echo "### Shell Script Security Lint Results" >> $GITHUB_STEP_SUMMARY

            # Install shellcheck
            sudo apt-get update && sudo apt-get install -y shellcheck

            find . -name "*.sh" -type f | while read script; do
              echo "Checking $script..." >> $GITHUB_STEP_SUMMARY
              shellcheck "$script" >> $GITHUB_STEP_SUMMARY || true
            done
          else
            echo "No shell scripts found"
          fi

      - name: Upload Security Lint Reports
        uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: security-lint-reports
          path: |
            bandit-report.json
            eslint-security.json
          retention-days: 30

  # Container Security Scanning
  container-security-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile') != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Final Security Report Aggregation
  security-report:
    name: Generate Security Audit Report
    runs-on: ubuntu-latest
    needs: [codeql-analysis, solidity-security-scan, secret-scanning, dependency-scan, validation-script-security]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3

      - name: Generate Security Summary
        run: |
          echo "# 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scans Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CodeQL Analysis (Go, JavaScript, Python)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Solidity Contract Security (Slither)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret Scanning (TruffleHog)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency Vulnerability Scanning" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Validation Script Security Linting" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container Security Scanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review all security findings in the Security tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Address critical and high severity issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Create immutable release after verification" >> $GITHUB_STEP_SUMMARY

      - name: Create Security Audit Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: complete-security-audit-${{ github.sha }}
          path: |
            slither-security-report/**
            security-lint-reports/**
          retention-days: 90
